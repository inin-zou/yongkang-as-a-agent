<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>Yongkang Zou — Social share card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Mono:wght@400&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --paper: #FAF9F6;
        --ink: #171717;
        --muted: #68675F;
        --accent: #244CB3;
        --line: #DEDDD6;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
      }

      body {
        padding: 64px 80px;
        color: var(--ink);
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .topbar {
        display: flex;
        align-items: center;
        height: 72px;
        padding-bottom: 28px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.6px;
        line-height: 1.2;
      }

      .brand svg { width: 26px; height: 36.4px; flex: none; }

      main { padding-top: 94px; }

      h1 {
        margin: 0 0 18px;
        font-size: 96px;
        font-weight: 500;
        letter-spacing: -0.0277778em;
        line-height: 1.2;
      }

      p { margin: 0; }

      .role { font-size: 36px; line-height: 1.4; }

      .learning {
        margin-top: 54px;
        color: var(--muted);
        font-family: "Space Mono", monospace;
        font-size: 24px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 20 28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <ellipse cx="11" cy="3" rx="2.5" ry="3" fill="#171717" />
          <path d="m9 7 4 0 3 9-3 1-2-5-1 7 7 7-3 2-6-8-3 8-4-1 5-12 1-6z" fill="var(--accent)" />
        </svg>
        <span>yongkang.dev</span>
      </div>
    </header>
    <main>
      <h1>Yongkang Zou</h1>
      <p class="role">AI Engineer · Paris</p>
      <p class="learning">My way of learning: BFS → DFS</p>
    </main>
  </body>
</html>
